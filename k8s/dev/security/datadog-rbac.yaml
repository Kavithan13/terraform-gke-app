apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent

rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - services
      - namespaces
      - events
      - endpoints
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update

  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/stats
      - nodes/metrics
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent

subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: default

roleRef:
  kind: ClusterRole
  name: datadog-agent
  apiGroup: rbac.authorization.k8s.io
