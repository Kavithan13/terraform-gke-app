apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog
  namespace: default

spec:
  selector:
    matchLabels:
      app: datadog

  template:
    metadata:
      labels:
        app: datadog

    spec:
      serviceAccountName: datadog-agent

      containers:
      - name: agent
        image: gcr.io/datadoghq/agent:latest

        ports:
        - containerPort: 8126
        - containerPort: 5001
          name: agentapi   # ✅ required for cluster-agent

        env:
        # ✅ API KEY
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-secret
              key: api-key

        - name: DD_SITE
          value: "us5.datadoghq.com"

        - name: DD_CLUSTER_NAME
          value: "shared-gke-cluster"

        # ✅ Cluster Agent communication
        - name: DD_CLUSTER_AGENT_ENABLED
          value: "true"

        - name: DD_CLUSTER_AGENT_KUBERNETES_SERVICE_NAME
          value: "datadog-cluster-agent"

        - name: DD_CLUSTER_AGENT_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: datadog-cluster-agent-secret
              key: token

        # ✅ REQUIRED (fixes 5001 properly)
        - name: DD_PROCESS_CONFIG_ENABLED
          value: "true"

        # ✅ Logs
        - name: DD_LOGS_ENABLED
          value: "true"

        - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
          value: "true"

        # ✅ APM
        - name: DD_APM_ENABLED
          value: "true"

        # ✅ GKE kubelet fix
        - name: DD_KUBELET_USE_API_SERVER
          value: "true"

        - name: DD_KUBERNETES_KUBELET_TLS_VERIFY
          value: "false"

        - name: DD_KUBERNETES_KUBELET_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
