apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: asia-south1-docker.pkg.dev/avian-outrider-497411-v9/docker-repo/frontend:v3

        ports:
        - containerPort: 80
