apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: asia-south1-docker.pkg.dev/avian-outrider-497411-v9/docker-repo/frontend:v1

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"