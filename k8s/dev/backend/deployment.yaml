apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: asia-south1-docker.pkg.dev/avian-outrider-497411-v9/docker-repo/backend:v5

        ports:
        - containerPort: 3000
