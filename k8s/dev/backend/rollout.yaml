apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 0

  selector:
    matchLabels:
      app: backend

  strategy:
    blueGreen:
      activeService: backend-active-service
      previewService: backend-preview-service
      autoPromotionEnabled: false   # manual control for demo

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa   # ✅ RBAC

      containers:
      - name: backend
        image: asia-south1-docker.pkg.dev/avian-outrider-497411-v9/docker-repo/backend:v16

        ports:
        - containerPort: 3000

        env:
        - name: APP_VERSION
          value: "v16"

        # ✅ OpenTelemetry → Datadog / tracing support
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://datadog-agent:4318

        # ✅ Alternative (Datadog direct)
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP

        # ✅ SECURITY FIX (important – avoids earlier crash)
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

        # ✅ RESOURCE LIMITS (best practice)
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        # ✅ READINESS PROBE
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10

        # ✅ LIVENESS PROBE
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 20