apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
      - name: user-container
        image: nginx

        ports:
        - containerPort: 80

        # ✅ ConfigMap
        envFrom:
        - configMapRef:
            name: user-config

        # ✅ Secret
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: user-secret
              key: DB_PASSWORD

        # ✅ Resource limits (best practice)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"