<!DOCTYPE html>
<html>
<body>

<h2>Frontend App ✅</h2>

<button onclick="callAPI()">Call Backend</button>

<pre id="output"></pre>

<script>
function callAPI() {
  fetch("/api")
    .then(res => res.json())
    .then(data => {
      document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
    })
    .catch(err => {
      document.getElementById("output").innerText =
        "Error calling backend";
      console.error(err);
    });
}
</script>

</body>
</html>
